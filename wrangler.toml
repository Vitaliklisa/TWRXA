name = "twrxa"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
APP_BASE_URL = "https://twrxa.khomenko.de"
APP_ALLOWED_ORIGINS = "https://twrxa.khomenko.de,https://twrxa.vercel.app"
PRODUCT_CURRENCY = "USD"
CHECKOUT_ALLOWED_COUNTRIES = "US,CA"
FLAT_SHIPPING_AMOUNT_CENTS = "0"
STRIPE_APPLICATION_FEE_BPS = "0"

[[routes]]
pattern = "api.twrxa.khomenko.de"
custom_domain = true

[triggers]
crons = ["0 9 * * *"]
